  stroke:
    __include: /preset_keyboards/luna_bihua

  terra_bihua:
    __include: /preset_keyboards/luna_bihua

  luna_bihua:
    ascii_mode: 0 # 这个是ascii的键盘模式，为0切换ascii模式则会加载ascii_keyboard所指定的键盘
    author: "Harry"
    name: "笔画键盘"
    lock: true
    ascii_keyboard: jiugong_number
    height: *VJG_Other
    horizontal_gap: *NJL
    vertical_gap: *NJH
    key_text_offset_y: *DtextY
    key_symbol_offset_y: *DsymY
    key_press_offset_x: 0
    key_press_offset_y: 8
    key_symbol_offset_x: *DsymX
    width: 23
    keys:
      - {click: ",", label: " ，", width: *NUM_SYM_W, key_text_offset_x: 3, key_symbol_offset_x: -12, key_symbol_offset_y: 20, long_click: "?", swipe_up: "?", key_symbol_color: key_symbol_color, key_back_color: szbdb, key_text_size: 16}
      - {click: "h", label: "一", key_back_color: szbdb, swipe_up: 1, key_text_size: 18}
      - {click: "s", label: "│", key_back_color: szbdb, swipe_up: 2, key_text_size: 18}
      - {click: "p", label: "丿", key_back_color: szbdb, swipe_up: 3, key_text_size: 18}
      - {click: BackSpace, width: *NUM_SYM_W, swipe_left: Clear, key_back_color: bksb, hilited_key_back_color: bksh, hilited_key_text_color: szhct, key_symbol_color: bkss, key_text_color: bkst, key_text_size: 20}

      - {click: ".", label: " 。", width: *NUM_SYM_W, key_text_offset_x: 3, key_symbol_offset_x: -12, key_symbol_offset_y: 20, long_click: "!", swipe_up: "!", key_symbol_color: key_symbol_color, key_back_color: szbdb, key_text_size: 16}
      - {click: "n", label: "丶", key_back_color: szbdb, swipe_up: 4, key_text_size: 18}
      - {click: "z", label: "𠃍", key_back_color: szbdb, swipe_up: Hide, key_text_size: 18}
      - {click: "*", label: "通配", composing: "*", key_back_color: szbdb, swipe_up: 6, key_text_size: 18}
      - {click: K_jiugongNumber, composing: Escape, width: *NUM_SYM_W, label: "123", key_back_color: szgnb, hilited_key_back_color: szgnh, key_text_size: 16}

      - {click: "^", label: " ……", width: *NUM_SYM_W, key_text_offset_x: 3, key_symbol_offset_x: -12, key_symbol_offset_y: 16, send_bindings: false, long_click: "(){Left}", swipe_left: "(", swipe_right: ")", key_symbol_color: key_symbol_color, key_back_color: szbdb, key_text_size: 16}
      - {click: "'", label: "分词", composing: "'", key_back_color: szbdb, swipe_up: 7, key_text_size: 18}
      - {click: "：", label: "：", key_back_color: szbdb, swipe_up: 8, key_text_size: 18}
      - {click: "；", label: "；", key_back_color: szbdb, swipe_up: 9, key_text_size: 18}
      - {click: K_jiugong_use, width: *NUM_SYM_W, label: "编辑", long_click: K_menu,  key_back_color: szgnb, hilited_key_back_color: szgnh, key_text_size: 16}

      - {click: "@", width: *NUM_SYM_W, key_text_offset_x: 3, key_symbol_offset_x: -12, key_symbol_offset_y: 18, send_bindings: false, long_click: "[]{Left}", swipe_left: "[", swipe_right: "]", key_symbol_color: key_symbol_color, key_back_color: szbdb, key_text_size: 16}
      - {click: liquid_keyboard_switch, label: "符", long_click: Menu, key_symbol_offset_x: 0, key_back_color: szgnb, hilited_key_back_color: szgnh, key_text_size: 16}
      - {click: space3, key_back_color: szbdb, swipe_up: 0, key_text_size: 20}
      - {click: K_jiugongLetter, long_click: Theme_settings1, swipe_up: Color_switch, key_back_color: szgnb, hilited_key_back_color: szgnh, key_text_size: 16}
      - {click: Return, width: *NUM_SYM_W, key_back_color: szhcb, hilited_key_back_color: szhch, key_text_color: szhct, hilited_key_text_color: szhct, key_symbol_color: hcs, key_text_size: 16}
