# Trime custom style settings
# encoding: utf-8

config_version: "3.0"
name: 同文风·增强版          #方案名称
author: SivanLaai        #作者信息

# 键盘候选
candidate_setting:
  A: &HXG 28  #候选区高度
  B: &HXJJ 15 #候选间距
  C: &HXZH 20 #候选字号
  D: &HXYJ 0  #候选圆角
  E: &HXGD 28        #候选高
  F: &BMGD 15        #编码高
  G: &BMZH 13 #编码字体大小

# -------调整完毕，如果出现上下档字符偏离键位，可调节下面项------
keyboard_height:
# ----------键盘高度调整------------
  A: &VJG 53         #主辅键盘键高  自定
  B: &VJM 53        #主辅键盘末行键高  B≈A，如主键盘和符号键盘不等高，调整此数
  C: &FJG 50        #符号键盘键高  (FJG × 5) + (FJH × 6) = (VJG × 4) + (VJH × 5) 解方程可以求出FJG = 50
  E: &DsymY 2.0           #主键盘上档文字纵向位置调节，负数上移，下同
  F: &DsymX 0             #主键盘上档文字横向位置调节，负数左移
  G: &DtextY 0              #主键盘字母纵向位置调节
  H: &VJtextY 0            #助记键盘字母纵向位置调节
  I: &VJhintY -2            #助记键盘韵母纵向位置调节
  J: &VJtextY -1            #助记键盘字母纵向位置调节，一般不需要调节
  K: &VJsymbolx 0.8          #助记符号（长按、上排文字）横向偏移（左右移动一般不需要，一般为零）
  L: &CQ_symbol 0             #助记键盘符号（长按、上排文字）偏移
  M: &CQ_hintY -3            #助记符号（下排文字、下档文字）纵向位置调节
  N: &CQ_text_size 20
  H: &VJG_Other 58
  I: &NUM_SYM_W 15.5   # 数字  符号键盘  宽度
#-------调节尽量以配色中键高最低的配色为标准------
other:
#主键盘结构（四行）
  a: &VJH 10         #主键盘行距  建议不动
  b: &VJL 4         #主键盘列距
  c: &VJY 12         #主键盘圆角
#符号键盘结构（五行）
  d: &FJH 2         #符号键盘行距  建议不动
  e: &FJL 2         #符号键盘列距
  f: &FJY 12         #符号键盘圆角
#数字键盘结构（四行）
  g: &NJH 6         #数字键盘行距  建议不动
  h: &NJL 6         #数字键盘列距
  i: &NJY 12         #数字键盘圆角

#键盘高度
height:
  1: &jpgd1 30 #表情键盘
  2: &jpgd2 24 #颜文字键盘1
  3: &jpgd3 24 #颜文字键盘2
  4: &jpgd4 48 #主键盘
  5: &jpgd5 39.5 #符号键盘
  6: &hgap 4 #键盘横缝大小
  7: &sgap 12 #键盘竖缝大小

#键盘高度
round_corner:
  1: &round1 6 #按键圆角半径
  2: &round2 0 #候选窗口圆角
  3: &round3 12 #回车键圆角
  
#界面风格、功能开关
style:
  auto_caps: false #自動句首大寫:true|false
  candidate_font: han.ttf  #候选字体
  candidate_padding: 5  #候选项内边距
  candidate_spacing: 0.0  #候选分割线
  candidate_text_size: 18  #候选字号
  candidate_text_vertical_bias: 1.0 #候选文本垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  candidate_view_height: 28 #候选区高度
  comment_font: comment.ttf #编码提示字体
  comment_height: 12 #编码提示区高度（仅 top 模式约束高度，其余模式与 candidate_view_height 无区别）
  comment_position: right #编码提示布局位置：right / top / overlay
  comment_vertical_bias: 0.0 #编码提示垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  comment_text_size: 10 #编码提示字号
  hanb_font: hanb.ttf #扩充字体
  horizontal_gap: *hgap #键水平间距
  key_font: symbol.ttf #键盘字体
  key_height: *jpgd4 #键高
  key_long_text_size: 16 #长标签字号
  key_text_size: 24 #键字号
  key_width: 10.0 #键宽，占屏幕宽的百分比
  label_text_size: 22 #标签字号
  label_font: label.ttf #编标签字体
  latin_font: latin.ttf #西文本体
  keyboard_height: 250 #锁定键盘高度，避免切换时键盘高度变化而造成闪烁
  keyboard_height_land: 200 #锁定横屏下键盘高度，避免切换时键盘高度变化而造成闪烁
  popup_font: latin.ttf #按键提示字体
  popup_width: 38 #按键提示宽度
  popup_height: 48 #按键提示高度
  popup_bottom_margin: 68 #按键提示底边距
  popup_key_height: 48 #按键提示内键高度
  popup_text_size: 23 #按键提示字号
  reset_ascii_mode_on_focus_change: false #焦点变更弹起输入法软键盘时，重置 ascii_mode
  round_corner: *round1 #按键圆角半径
  shadow_radius: 0.0 #按键阴影半径
  symbol_font: symbol.ttf #符号字体
  symbol_text_size: 10 #符号字号
  text_font: latin.ttf #编码字体
  vertical_gap: *sgap #键盘行距
  enter_label_mode: 0  #是否使用App提供的ActionLabel内容作为Enter键的文本（由于多数App没有适配ActionLable，实际影响不大）。0不使用，1只使用actionlabel，2优先使用，3当其他方式没有获得label时才读取actionlabel
  enter_labels:  # 定义Enter键的文本
    go: 前往
    done: 完成
    next: 下个
    pre:  上个
    search: 搜索
    send: 发送
    default: Enter   # 定义默认Enter键的文本

preedit:                  # 预编辑文本视图参数
  horizontal_padding: 8     # 横向内边距（整数）
#  alpha: 0.8                 # 透明度（0-1，浮点）
  top_end_radius: 4         # 末上端圆角（浮点）
  foreground:               # 前景样式
    font_size: 16             # 预编辑字体大小（浮点）

window:               # 候选窗口（悬浮窗）参数
  insets:               # 窗口内边距
    vertical: 4           # 纵向内边距（整数）
    horizontal: 4         # 横向内边距（整数）
  item_padding:         # 候选项内边距
#    vertical: 0           # 纵向内边距（整数）
    horizontal: 4         # 横向内边距（整数）
#  min_width: 0          # 最小宽度（整数）
#  corner_radius: 0      # 圆角半径（浮点）
#  border: 0             # 边框宽度（整数）
#  shadow: 0.0           # 阴影半径（浮点）
#  alpha: 1              # 透明度（0-1，浮点）
  foreground:           # 前景样式
    label_font_size: 20   # 序号字体大小（浮点）
    text_font_size: 20    # 文字字体大小（浮点）
    comment_font_size: 16  # 注释字体大小（浮点）

# 最好保留一项，防止其他主题使用 __include 时无法加载
fallback_colors:
  candidate_text_color: text_color
# 以下值是程序内置的，你也可以在这里自定义，这会覆盖默认值
#
#  comment_text_color: candidate_text_color
#  border_color: back_color
#  candidate_separator_color: border_colorG
#  hilited_text_color: text_color
#  hilited_back_color: back_color
#  hilited_candidate_text_color: hilited_text_color
#  hilited_candidate_back_color: hilited_back_color
#  hilited_candidate_button_color: hilited_candidate_back_color # 候选栏工具按钮高亮背景色
#  hilited_label_color: hilited_candidate_text_color # 高亮候选序号 颜色
#  hilited_comment_text_color: comment_text_color
#  hilited_key_back_color: hilited_candidate_back_color
#  hilited_key_text_color: hilited_candidate_text_color
#  hilited_key_symbol_color: hilited_comment_text_color
#  hilited_off_key_back_color: hilited_key_back_color
#  hilited_on_key_back_color: hilited_key_back_color
#  hilited_off_key_text_color: hilited_key_text_color
#  hilited_on_key_text_color: hilited_key_text_color
#  key_back_color: back_color
#  key_border_color: border_color
#  key_text_color: candidate_text_color
#  key_symbol_color: comment_text_color
#  label_color: candidate_text_color
#  off_key_back_color: key_back_color
#  off_key_text_color: key_text_color
#  on_key_back_color: hilited_key_back_color
#  on_key_text_color: hilited_key_text_color
#  preview_back_color: key_back_color
#  preview_text_color: key_text_color
#  shadow_color: border_color
#  root_background: back_color # 整个键盘区+候选栏的背景图/色
#  candidate_background: back_color #候选栏的整体背景图/色
#  keyboard_back_color: border_color #键盘区的背景图/色
#  liquid_keyboard_background: keyboard_back_color # liquidKeyboard的背景图/色
#  text_back_color: back_color #编码区背景，即悬浮窗背景
#  long_text_back_color: key_back_color #长文本按键的背景(剪贴板）

#颜色
colors:
  1: &COLOR_BLACK 0xff000000 #黑
  2: &COLOR_WHITE 0xffffffff #白
  3: &COLOR_GRAY_WHITE 0xffe1e3e7 # 灰白
  4: &COLOR_DARK_GRAY_WHITE 0xffacb2c2 # 深灰白
  5: &COLOR_DARK_GRAY_BLACK 0xff131313 # 深灰黑
  6: &COLOR_GRAY_BLUE 0xff3266a0 # 灰蓝
  7: &COLOR_TRANSPARENT 0x00000000 #透明
  8: &COLOR_GRAY 0xff838383 # 灰
  9: &COLOR_LIGHT_GRAY 0xFFe5e6eb #浅灰
  10: &COLOR_LIGHT_GRAY_PP 0xffc9cace #浅灰++
  11: &COLOR_DARK_SLATE_GRAY 0xFF2F4F4F #墨绿色
  12: &COLOR_ORANGE  0xFFf57d51  #橙
  13: &COLOR_DARK_SLATE_GRAY1 0xff253238 #墨绿色1
  14: &COLOR_LIGHT_GRAY_P 0xffcccccc #浅灰+
  15: &COLOR_DARK_SLATE_GRAY2 0xff354346 #墨绿色2
  16: &COLOR_RED  0xffe63549 #红色
  17: &COLOR_DARK_RED 0xff881c1c  #深暗红
  18: &COLOR_LIGHT_SEA_BLUE 0xff1693d8 #浅海蓝
  19: &COLOR_DARK_SEA_BLUE 0xff007dc7  #暗海蓝
  20: &COLOR_BLACK_1 0xff888888 #黑1
  21: &COLOR_GRAY_1 0xffaaaaaa #灰1
  21: &COLOR_LIGHT_BLUE 0xFF56A2FA #浅蓝
  22: &COLOR_IFLY_BLUE 0xFF3d9dff #讯飞蓝
  23: &COLOR_LIGHT_IFLY_GRAY_P 0xFFb6b7b9 #讯飞功能按键激活灰
  24: &COLOR_NOSIGNAL_GRAY 0xffa3a7aa #按键无法选择灰
  25: &COLOR_DARK_GRAY 0xff6f7b83 #深灰
  26: &COLOR_DARK_SEA_BLUE_P 0xff025281 #深暗海蓝
  27: &COLOR_XPERIA_CANDIDATE_GREEN 0xff00a886 #SONY绿
  
#配色方案
preset_color_schemes:
  default:
    name: "默认.同文风优化版"
    author: SivanLaai
    # 悬浮窗
    border_color: *COLOR_LIGHT_GRAY #悬浮窗边框
    text_color: *COLOR_XPERIA_CANDIDATE_GREEN #悬浮窗编码
    text_back_color: *COLOR_WHITE #悬浮窗背景
    hilited_text_color: *COLOR_XPERIA_CANDIDATE_GREEN #悬浮窗高亮编码
    label_color: *COLOR_BLACK #悬浮窗候选项序号
    hilited_back_color: *COLOR_TRANSPARENT #悬浮窗高亮编码背景MIUI
    # 候选区
    back_color: *COLOR_WHITE #候选区背景状态栏(无障碍)
    candidate_separator_color: *COLOR_TRANSPARENT #候选区分隔颜色
    candidate_text_color: *COLOR_BLACK # 候选区文本颜色
    comment_text_color: *COLOR_LIGHT_GRAY_PP # 候选区编码文本颜色
    hilited_candidate_back_color: *COLOR_TRANSPARENT # 候选区高亮背景颜色
    hilited_candidate_text_color: *COLOR_DARK_SEA_BLUE # 候选区高亮文本颜色
    hilited_comment_text_color: *COLOR_ORANGE # 候选区高亮编码文本颜色
    # 键盘
    keyboard_back_color: *COLOR_LIGHT_GRAY #键盘背景颜色
    # 正常按键
    key_back_color: *COLOR_WHITE #按键背景颜色
    key_border_color: *COLOR_TRANSPARENT #按键边框颜色
    key_symbol_color: *COLOR_DARK_GRAY #按键符号颜色
    key_text_color: *COLOR_BLACK #按键文本颜色
    hilited_key_back_color: *COLOR_LIGHT_GRAY_PP #按键激活背景颜色
    hilited_key_symbol_color: *COLOR_DARK_GRAY #按键激活符号颜色
    hilited_key_text_color: *COLOR_BLACK #按键激活文本颜色
    # 功能键，shift常态
    off_key_back_color: *COLOR_DARK_GRAY_WHITE #功能键，shift常态  背景颜色
    off_key_text_color: *COLOR_BLACK #功能键，shift常态  文本颜色
    hilited_off_key_back_color: *COLOR_GRAY #激活功能键，shift常态  背景颜色
    hilited_off_key_text_color: *COLOR_BLACK #激活功能键，shift常态  文本颜色
    # shift激活
    on_key_back_color:  *COLOR_DARK_SEA_BLUE_P # 背景颜色
    on_key_text_color: *COLOR_WHITE # 文本颜色
    hilited_on_key_back_color: *COLOR_DARK_SEA_BLUE_P
    hilited_on_key_text_color: *COLOR_WHITE
    # 按键下去气泡
    preview_back_color: *COLOR_TRANSPARENT
    preview_text_color: *COLOR_BLACK
    shadow_color: *COLOR_BLACK
    # 按键额外配置
    AAA: *COLOR_WHITE
    BBB: *COLOR_WHITE
    CCC: *COLOR_WHITE
    ABH: *COLOR_LIGHT_GRAY_P
    AAH: *COLOR_LIGHT_GRAY_P
    BBH: *COLOR_LIGHT_GRAY_P
    CCH: *COLOR_LIGHT_GRAY_P
    # 数字
    szbdb: *COLOR_WHITE
    szhcb: *COLOR_DARK_SEA_BLUE
    szhch: *COLOR_DARK_SEA_BLUE_P
    szgnb: *COLOR_DARK_GRAY_WHITE
    szgnh: *COLOR_GRAY
    szhct: *COLOR_WHITE
    # 符号
    bdb: *COLOR_WHITE
    bdh: *COLOR_LIGHT_GRAY_P
    # 功能
    gnb: *COLOR_DARK_GRAY_WHITE
    gnh: *COLOR_GRAY
    gns: *COLOR_DARK_GRAY
    # 空格
    kgb: *COLOR_WHITE
    kgh: *COLOR_LIGHT_GRAY_PP
    kgs: *COLOR_DARK_GRAY
    kgt: *COLOR_BLACK
    # backspace
    bkss: *COLOR_WHITE
    bkst: *COLOR_WHITE # backspace按键颜色
    bksb: *COLOR_RED # backspace按键背景
    bksh: *COLOR_DARK_RED # backspace按键激活背景
    # 回车
    hcb: *COLOR_DARK_SEA_BLUE
    hch: *COLOR_DARK_SEA_BLUE_P
    hcs: *COLOR_DARK_GRAY
    hct: *COLOR_WHITE
    hcht: *COLOR_WHITE
    hchs: *COLOR_DARK_GRAY
    hbdt: *COLOR_WHITE
    hsb: *COLOR_DARK_SEA_BLUE
    # 符号
    cdt: *COLOR_IFLY_BLUE
    fyt: *COLOR_NOSIGNAL_GRAY
    # 菜单
    xdb: *COLOR_WHITE
    # 键盘布局引用的中间颜色别名（对应原tongwenfeng的*color1-*color8映射）
    # color1=黑, color2=白, color3=灰白, color4=深灰白, color5=深灰黑, color6=灰蓝, color7=透明, color8=灰
    bkg: *COLOR_WHITE #空格键背景色 (was *color2)
    tkg: *COLOR_BLACK #空格键文字颜色 (was *color1)
    benter: *COLOR_GRAY_BLUE #回车键背景色 (was *color6)
    tenter: *COLOR_WHITE #回车键文字颜色 (was *color2)
    bgn: *COLOR_DARK_GRAY_WHITE #功能键背景色 (was *color4)
    tgn: *COLOR_WHITE #功能键文字颜色 (was *color2)
    bbs: *COLOR_DARK_GRAY_WHITE #退格键背景色 (was *color4)
    tbs: *COLOR_WHITE #退格键文字颜色 (was *color2)
    baoe: *COLOR_WHITE #aoeiu背景色 (was *color2)
    taoe: *COLOR_GRAY_BLUE #aoeiu文字颜色 (was *color6)
    bh1: *COLOR_WHITE #第一行背景色 (was *color2)
    th1: *COLOR_BLACK #第一行文字颜色 (was *color1)
    bh2: *COLOR_WHITE #第二行背景色 (was *color2)
    th2: *COLOR_BLACK #第二行文字颜色 (was *color1)
    bh3: *COLOR_WHITE #第三行背景色 (was *color2)
    th3: *COLOR_BLACK #第三行文字颜色 (was *color1)
    bh4: *COLOR_WHITE #第四行背景色 (was *color2)
    th4: *COLOR_BLACK #第四行文字颜色 (was *color1)
    gnt: *COLOR_WHITE #功能键文字颜色（符号键盘等）
    bct0: *COLOR_GRAY_BLUE #aoeiu字母键文字颜色

  default1:
    name: "默认.讯飞原生版"
    author: SivanLaai
    # 悬浮窗
    border_color: *COLOR_LIGHT_GRAY #悬浮窗边框
    text_color: *COLOR_BLACK #悬浮窗编码
    text_back_color: *COLOR_WHITE #悬浮窗背景
    hilited_text_color: *COLOR_BLACK #悬浮窗高亮编码
    label_color: *COLOR_BLACK #悬浮窗候选项序号
    hilited_back_color: *COLOR_TRANSPARENT #悬浮窗高亮编码背景
    # 候选区
    back_color: *COLOR_WHITE #0xffeaeaea #候选区背景状态栏(无障碍)
    candidate_separator_color: *COLOR_TRANSPARENT #候选区分隔颜色
    candidate_text_color: *COLOR_BLACK # 候选区文本颜色
    comment_text_color: *COLOR_LIGHT_GRAY_PP #0xff242424 # 0xFFADADAD  # 候选区编码文本颜色
    hilited_candidate_back_color: *COLOR_TRANSPARENT # 候选区高亮背景颜色
    hilited_candidate_text_color: *COLOR_IFLY_BLUE #0xff1693d8 # 候选区高亮文本颜色
    hilited_comment_text_color: *COLOR_IFLY_BLUE #0xff696969 # 候选区高亮编码文本颜色
    # 键盘
    keyboard_back_color: *COLOR_LIGHT_GRAY #键盘背景颜色
    # 正常按键
    key_back_color: *COLOR_WHITE #按键背景颜色
    key_border_color: *COLOR_TRANSPARENT #按键边框颜色
    key_symbol_color: *COLOR_DARK_GRAY # 0xff6f7b83 #按键符号颜色
    key_text_color: *COLOR_BLACK # 0xff4a4a4a #按键文本颜色
    hilited_key_back_color: *COLOR_LIGHT_GRAY_PP #0xffe1e1e1 #按键激活背景颜色
    hilited_key_symbol_color: *COLOR_DARK_GRAY #按键激活符号颜色
    hilited_key_text_color: *COLOR_BLACK #按键激活文本颜色
    # 功能键，shift常态
    off_key_back_color: *COLOR_LIGHT_GRAY_PP #功能键，shift常态  背景颜色
    off_key_text_color: *COLOR_BLACK #功能键，shift常态  文本颜色
    hilited_off_key_back_color: *COLOR_LIGHT_IFLY_GRAY_P #激活功能键，shift常态  背景颜色
    hilited_off_key_text_color: *COLOR_BLACK #激活功能键，shift常态  文本颜色
    # shift激活
    on_key_back_color:  *COLOR_DARK_SEA_BLUE # 背景颜色
    on_key_text_color: *COLOR_WHITE # 文本颜色
    hilited_on_key_back_color: *COLOR_DARK_SEA_BLUE
    hilited_on_key_text_color: *COLOR_WHITE
    # 按键下去气泡
    preview_back_color: *COLOR_TRANSPARENT
